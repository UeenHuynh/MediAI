[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
minversion = 7.0
addopts =
    -v
    -l
    -ra
    --strict-markers
    -W ignore::DeprecationWarning
    --cov=api
    --cov=apps
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --durations=10

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    api: Tests requiring external API
    database: Tests requiring database
    llm: Tests requiring LLM API
    rag: RAG system tests
    pii: PII masking tests
    agent: Agent orchestrator tests
