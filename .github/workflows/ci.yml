name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r requirements.txt
        pip install -r api/requirements.txt
        pip install -r apps/requirements.txt

    - name: Download model files
      run: |
        # Models should be committed to repo or downloaded from artifact storage
        ls -la models/

    - name: Run unit tests
      run: |
        pytest tests/test_model_service.py -v --cov=apps/services --cov-report=xml

    - name: Run encryption tests
      run: |
        pytest tests/test_encryption.py -v --cov=apps/utils --cov-append --cov-report=xml

    - name: Run API tests
      run: |
        pytest tests/test_api.py -v --cov=api --cov-append --cov-report=xml

    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v --cov-append --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 apps/ api/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 apps/ api/ --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check apps/ api/

    - name: Check import sorting with isort
      run: |
        isort --check-only apps/ api/

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security scan
      run: |
        bandit -r apps/ api/ -f json -o bandit-report.json

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API image
      run: |
        docker build -t mediai-api:test -f api/Dockerfile .

    - name: Build Streamlit image
      run: |
        docker build -t mediai-app:test -f apps/Dockerfile .

    - name: Test Docker images
      run: |
        docker images | grep mediai
