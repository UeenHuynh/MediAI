name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, improve-chatbot ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Linting & Code Quality
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint mypy

      - name: Run Black (Code Formatter Check)
        run: |
          black --check --diff api/ apps/ scripts/
        continue-on-error: true

      - name: Run isort (Import Sorter Check)
        run: |
          isort --check-only --diff api/ apps/ scripts/
        continue-on-error: true

      - name: Run Flake8 (Linter)
        run: |
          flake8 api/ apps/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 api/ apps/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pylint
        run: |
          pylint api/ --exit-zero --disable=C,R
        continue-on-error: true

  # Job 2: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit (Security Linter)
        run: |
          bandit -r api/ apps/ -f json -o bandit-report.json || true
          bandit -r api/ apps/ -ll

      - name: Run Safety (Dependency Vulnerability Check)
        run: |
          safety check --json || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # Job 3: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.chatbot.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Download spaCy model
        run: |
          python -m spacy download en_core_web_sm

      - name: Run Unit Tests with Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_key_for_ci' }}
          QDRANT_URL: ${{ secrets.QDRANT_URL || 'https://dummy.test' }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY || 'dummy_key_for_ci' }}
        run: |
          pytest tests/unit/ \
            --cov=api \
            --cov=apps \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -m "not api and not integration" \
            -v \
            || true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            htmlcov/

  # Job 4: SonarCloud Analysis
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: test-results-3.11
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # Job 5: Integration Tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mimic_iv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements.chatbot.txt
          pip install pytest pytest-asyncio
          python -m spacy download en_core_web_sm

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimic_iv_test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          pytest tests/integration/ -v --maxfail=1

  # Job 6: Build & Deploy (Only on main branch)
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint, security, test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Application
        run: |
          pip install -r requirements.txt
          pip install -r requirements.chatbot.txt
          python -m spacy download en_core_web_sm

      - name: Deploy to Production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "🚀 Deploying to production..."
          # Add your deployment script here
          # Example: ./scripts/deploy.sh

      - name: Notify Deployment Success
        if: success()
        run: |
          echo "✅ Deployment successful!"

      - name: Notify Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
