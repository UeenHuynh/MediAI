# ===================================================================
# SonarQube Configuration for MediAI Chatbot
# ===================================================================

# Project Information
sonar.projectKey=mediai-advanced-chatbot
sonar.projectName=MediAI Advanced Chatbot
sonar.projectVersion=2.0.0

# Source Code
sonar.sources=api,apps
sonar.tests=tests
sonar.python.version=3.11

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage Reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# Exclusions
sonar.exclusions=**/migrations/**,**/tests/**,**/venv/**,**/__pycache__/**,**/node_modules/**
sonar.test.exclusions=**/tests/**

# Code Quality Gates
sonar.qualitygate.wait=true

# Python-specific settings
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# Duplications
sonar.cpd.exclusions=**/tests/**

# Security Hotspots
sonar.python.bandit.enabled=true

# Coverage thresholds
# sonar.coverage.minimum=80

# Issue Severity
sonar.issue.ignore.multicriteria=e1,e2

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# Ignore print statements (for debugging in dev)
sonar.issue.ignore.multicriteria.e2.ruleKey=python:PrintStatementUsage
sonar.issue.ignore.multicriteria.e2.resourceKey=**/scripts/**/*.py
