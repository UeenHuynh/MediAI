# ===================================================================
# SonarQube Configuration for MediAI Healthcare Platform
# ===================================================================
# Location: Place this file at the ROOT of MediAI repository
# ===================================================================

# ===================
# Project Information
# ===================
# NOTE: Update projectKey and organization after importing to SonarCloud
sonar.projectKey=UeenHuynh_MediAI
sonar.organization=ueenhuynh
sonar.projectName=MediAI Healthcare Platform
sonar.projectVersion=2.0.0

# ===================
# Source Code Paths
# ===================
# Backend API + Streamlit Apps + Frontend + AI Agents + Streaming
sonar.sources=api,apps,frontend/src,agents,streaming
sonar.tests=tests
sonar.python.version=3.11

# ===================
# Encoding
# ===================
sonar.sourceEncoding=UTF-8

# ===================
# Coverage Reports
# ===================
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# ===================
# Exclusions
# ===================
# Files/folders to exclude from analysis
sonar.exclusions=\
    **/migrations/**,\
    **/venv/**,\
    **/.venv/**,\
    **/__pycache__/**,\
    **/node_modules/**,\
    **/*.min.js,\
    **/*.min.css,\
    **/dist/**,\
    **/build/**,\
    **/.next/**,\
    **/coverage/**,\
    **/*.lock,\
    **/package-lock.json

# Test exclusions
sonar.test.exclusions=**/tests/**,**/test_*.py,**/*_test.py

# ===================
# Code Quality Gates
# ===================
sonar.qualitygate.wait=true

# ===================
# Python Settings
# ===================
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.bandit.enabled=true

# ===================
# Duplications
# ===================
sonar.cpd.exclusions=**/tests/**,**/migrations/**

# ===================
# Issue Ignore Rules
# ===================
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# Ignore print statements in scripts
sonar.issue.ignore.multicriteria.e2.ruleKey=python:PrintStatementUsage
sonar.issue.ignore.multicriteria.e2.resourceKey=**/scripts/**/*.py

# Ignore print statements in CLI tools
sonar.issue.ignore.multicriteria.e3.ruleKey=python:PrintStatementUsage
sonar.issue.ignore.multicriteria.e3.resourceKey=**/cli/**/*.py

# ===================
# Coverage Thresholds (Optional - uncomment to enforce)
# ===================
# sonar.coverage.minimum=80
# sonar.duplicated_lines_density.maximum=3

# ===================
# Additional Settings
# ===================
# Links for SonarCloud dashboard
sonar.links.homepage=https://github.com/UeenHuynh/MediAI
sonar.links.ci=https://github.com/UeenHuynh/MediAI/actions
sonar.links.scm=https://github.com/UeenHuynh/MediAI
sonar.links.issue=https://github.com/UeenHuynh/MediAI/issues